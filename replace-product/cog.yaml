build:
  gpu: true
  cuda: "12.1"
  system_packages:
    - ffmpeg
  python_version: "3.12"
  python_requirements: requirements.txt
  run:
    - pip install alembic sqlalchemy
    - curl -o /usr/local/bin/pget -L "https://github.com/replicate/pget/releases/latest/download/pget_$(uname -s)_$(uname -m)" && chmod +x /usr/local/bin/pget
    - pip install onnxruntime-gpu --extra-index-url https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/
    - pip install hf_transfer huggingface_hub
    
    - mkdir -p /src/ComfyUI/models/loras
    - mkdir -p /src/ComfyUI/models/Janus-Pro
    
    - HF_HUB_ENABLE_HF_TRANSFER=1 huggingface-cli download ali-vilab/ACE_Plus subject/comfyui_subject_lora16.safetensors --local-dir /tmp/ace_plus --local-dir-use-symlinks False
    - mv /tmp/ace_plus/subject/comfyui_subject_lora16.safetensors /src/ComfyUI/models/loras/
    - rm -rf /tmp/ace_plus
    
    - HF_HUB_ENABLE_HF_TRANSFER=1 huggingface-cli download deepseek-ai/Janus-Pro-1B --local-dir /src/ComfyUI/models/Janus-Pro/Janus-Pro-1B --local-dir-use-symlinks False
    
    - python -c "
      import urllib.request
      import os
      model_path = '/src/ComfyUI/models/Janus-Pro/Janus-Pro-1B'
      target_path = os.path.join(model_path, 'tokenizer.model')
      try:
          print('Downloading tokenizer.model...')
          url = 'https://huggingface.co/NousResearch/Llama-2-7b-hf/resolve/main/tokenizer.model'
          urllib.request.urlretrieve(url, target_path)
          print(f'Downloaded tokenizer.model: {os.path.getsize(target_path)} bytes')
      except Exception as e:
          print(f'Failed to download tokenizer.model: {e}')
          raise
      "

predict: "predict.py:Predictor"
train: "train.py:train"